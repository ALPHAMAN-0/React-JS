<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AIUB Portal Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <div class="logo-section">
        <img src="aiub_logo_92x92.png" alt="AIUB Logo">
        <h1>AMERICAN INTERNATIONAL UNIVERSITY-BANGLADESH</h1>
        <p class="tagline">where leaders are created.</p>
    </div>

    <div class="login-box">
        <p class="info-text">Sign in with your organizational id number.</p>

        <form>
            <input type="text" placeholder="Organizational ID Number" required>

            <input type="password" placeholder="Password" required>

            <div class="captcha-box">
                <img src="captcha_placeholder.png" alt="Captcha">
                <span>The answer is</span>
                <input type="text" placeholder="Enter answer">
            </div>

            <button type="submit">Log In</button>
        </form>

        <a href="#" class="forgot-link">Can’t access your account?</a>
    </div>

</div>

</body>
</html>
